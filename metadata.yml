Interpretation: Rank score of a compounds predicted permeation of the 
  Pseudomonas aeruginosa outer membrane (IC50 ratio above 0.5), calibrated 
  against a reference library of 50,000 drug-like molecules. A rank score above 
  0.65 beats 99% of that library.
