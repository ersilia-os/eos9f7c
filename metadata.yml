Title: Permeation of compounds across the outer membrane of P. aeruginosa
Description: Estimates whether a compound crosses the outer membrane of Pseudomonas aeruginosa, an organism whose envelope is markedly less permeable than that of other Gram-negative bacteria and which sits high on the WHO priority list. The authors measured accumulation for a compound set and related it to calculated molecular descriptors, identifying the physicochemical ranges that favour entry. Permeation is a prerequisite for activity, so a high score indicates access to the cell rather than antibacterial effect.
